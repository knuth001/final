<section class="page-card">
  <h2>რეისის ძებნა</h2>
  <form (ngSubmit)="searchTrains()" class="search-form">
    <label>
      გამგზავრება
      <select [(ngModel)]="search.origin" name="origin">
        <option *ngFor="let city of cities" [ngValue]="city">{{ city }}</option>
      </select>
    </label>
    <label>
      დანიშნულება
      <select [(ngModel)]="search.destination" name="destination">
        <option *ngFor="let city of cities" [ngValue]="city">{{ city }}</option>
      </select>
    </label>
    <label>
      თარიღი
      <input type="date" [(ngModel)]="search.date" name="date" />
    </label>
    <label>
      მგზავრების რაოდენობა
      <input type="number" min="1" max="6" [(ngModel)]="search.passengerCount" name="passengerCount" />
    </label>
    <button type="submit" class="primary-button">მატარებლის მოძებნა</button>
  </form>
</section>
